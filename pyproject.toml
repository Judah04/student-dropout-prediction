[project]
name = "student-dropout-prediction"
version = "0.1.0"
description = "Predict student dropout / enrolled / graduate (ML Zoomcamp 2026 midterm project)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.119.1",
    "joblib>=1.4",
    "numpy==2.3.3",
    "pandas>=2.2",
    "scikit-learn==1.7.2",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "seaborn>=0.13",
]
